####################################
# Port & Project Name
####################################
server:
  port: 8080                    # 포트 번호

spring:
  application:
    name: SBB

  devtools:
    restart:
      enabled: true

    livereload:
      enabled: true
      port: 35729

  thymeleaf:
    cache: false

  ####################################
  # MySQL 설정
  ####################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sbb_a?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: '0000'

  ####################################
  # JPA 설정
  ####################################
  jpa:
    open-in-view: true      # JPA 영속성 컨텍스트를 뷰까지 유지할지 여부
    hibernate:
      ddl-auto: update      # create, update, ...
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy # 카멜케이스를 언더스코어로 변환
    show-sql: true          # SQL 출력 여부
    properties:
      hibernate:
        format_sql: true    # SQL 포맷팅 여부
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    encoding:
      charset: UTF-8        # 인코딩 설정

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<th:block layout:fragment="css">
    <style>
        .fieldError {
            color: #b02a37;
        }
    </style>
</th:block>

<div layout:fragment="content" class="container my-3">
    <!-- 질문 Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${question.subject}">제목</h4>
        </div>
        <div class="card-body">
            <p class="card-text fs-5"
               style="white-space: pre-wrap;"
               th:text="${question.content}">내용</p>
        </div>
    </div>

    <!-- 답변 목록 -->
    <div class="mb-4">
        <h5 class="mb-3">
            답변 목록
            <span class="badge bg-primary"
                  th:text="${#lists.size(question.answerList)}">0</span>
        </h5>

        <!-- 답변이 없는 경우 -->
        <div th:if="${#lists.isEmpty(question.answerList)}"
             class="alert alert-light text-muted border">
            아직 등록된 답변이 없습니다.
        </div>

        <!-- 답변마다 개별 Card 생성 -->
        <div th:each="answer : ${question.answerList}"
             class="card shadow-sm mb-3">

            <div class="card-body">
                <p class="card-text mb-0"
                   style="white-space: pre-wrap;"
                   th:text="${answer.content}">
                    답변 내용
                </p>
            </div>

        </div>
    </div>

    <!-- 답변 작성 Card -->
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="mb-0">답변 작성</h5>
        </div>

        <div class="card-body">
            <form th:action="@{|/answer/create/${question.id}|}"
                  th:object="${answerDto}"
                  method="post">

                <div class="mb-3">
                    <label for="content" class="form-label">
                        답변 내용
                    </label>
                    <textarea
                            id="content"
                            name="content"
                            class="form-control"
                            rows="6"
                            placeholder="답변을 입력해주세요."
                            th:field="*{content}"                            >
                    </textarea>
                    <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="fieldError">error</p>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        답변 등록
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<th:block layout:fragment="css">
    <style>
        .fieldError {
            color: #b02a37;
        }
    </style>
</th:block>

<div layout:fragment="content" class="container my-3">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">질문 등록</h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/question/create}" th:object="${questionDto}" method="post">

                        <!-- 제목 -->
                        <div class="mb-3">
                            <label for="subject" class="form-label">
                                제목
                            </label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="subject"
                                    name="subject"
                                    th:field="*{subject}"
                                    placeholder="제목을 입력하세요."
                                    >
                            <p th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="fieldError">error</p>
                        </div>

                        <!-- 내용 -->
                        <div class="mb-3">
                            <label for="content" class="form-label">
                                내용
                            </label>
                            <textarea
                                    class="form-control"
                                    id="content"
                                    name="content"
                                    rows="8"
                                    placeholder="내용을 입력하세요."
                                    th:field="*{content}"
                                    >
                            </textarea>
                            <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="fieldError">error</p>
                        </div>

                        <!-- 저장 버튼 -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                저장하기
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

</div>
</html>
